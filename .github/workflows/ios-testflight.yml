name: iOS TestFlight Build

# Builds the LYVE iOS shell (Capacitor) on a hosted macOS runner and uploads
# it to TestFlight. Run it manually from the Actions tab — no Mac required.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (leave empty to use the run number)"
        required: false
        default: ""

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    env:
      SCHEME: App
      WORKSPACE: ios/App/App.xcworkspace
      BUNDLE_ID: app.lyve.ios

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web assets
        run: bun run build

      - name: Sync Capacitor iOS project
        run: bunx cap sync ios

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      - name: Download provisioning profile
        uses: apple-actions/download-provisioning-profiles@v3
        with:
          bundle-id: app.lyve.ios
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      - name: Set build number
        run: |
          BUILD_NUMBER="${{ github.event.inputs.build_number }}"
          if [ -z "$BUILD_NUMBER" ]; then BUILD_NUMBER="${{ github.run_number }}"; fi
          cd ios/App
          xcrun agvtool new-version -all "$BUILD_NUMBER"

      - name: Archive
        run: |
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/LYVE.xcarchive" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Manual \
            archive

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>manual</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LYVE.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APPSTORE_PRIVATE_KEY }}" > ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8
          xcrun altool --upload-app -f "$RUNNER_TEMP/export/App.ipa" -t ios \
            --apiKey "${{ secrets.APPSTORE_KEY_ID }}" \
            --apiIssuer "${{ secrets.APPSTORE_ISSUER_ID }}"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lyve-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore

  # Required status check that branch protection can gate on before merging.
  # It mirrors the build result so that the overall workflow outcome is visible
  # as a single, stable check name.
  ios-testflight-status:
    name: iOS TestFlight Build
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Report iOS TestFlight build status
        run: |
          BUILD_RESULT="${{ needs.build.result }}"
          echo "Build job result: $BUILD_RESULT"
          if [ "$BUILD_RESULT" == "success" ]; then
            echo "iOS TestFlight build passed."
            exit 0
          else
            echo "iOS TestFlight build did not pass (result: $BUILD_RESULT)."
            exit 1
          fi

