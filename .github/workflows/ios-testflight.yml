name: iOS TestFlight Build
# workflow revision: sdk26-r3 (2026-08-21)

# Builds the LYVE iOS shell (Capacitor) on a hosted macOS runner and uploads
# it to TestFlight. Runs automatically on pull requests that touch iOS or
# workflow files, and can also be triggered manually from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (leave empty to use the run number)"
        required: false
        default: ""
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ios-testflight.yml"
      - "ios/**"
      - "capacitor.config.ts"

jobs:
  build:
    # App Store Connect requires builds produced with the iOS 26 SDK,
    # which ships with Xcode 26 on the macos-26 runner image.
    runs-on: macos-26
    timeout-minutes: 60

    env:
      SCHEME: App
      PROJECT: ios/App/App.xcodeproj
      BUNDLE_ID: app.lyve.ios
      WORKFLOW_REVISION: sdk26-r3

    steps:
      - name: Confirm workflow revision
        run: |
          echo "Workflow revision: $WORKFLOW_REVISION"
          echo "Commit: $GITHUB_SHA"
          echo "Ref: $GITHUB_REF"
          echo "### Workflow revision: \`$WORKFLOW_REVISION\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify required Apple secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          missing=()
          for name in APPLE_TEAM_ID IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD \
                      APPSTORE_ISSUER_ID APPSTORE_KEY_ID APPSTORE_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done

          # Shape checks only — values are never printed.
          if [ -n "${APPSTORE_PRIVATE_KEY:-}" ] && \
             ! printf '%s' "$APPSTORE_PRIVATE_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            echo "::error::APPSTORE_PRIVATE_KEY must contain the full .p8 contents, including the BEGIN/END PRIVATE KEY lines."
            exit 1
          fi
          if [ -n "${IOS_DIST_CERT_P12_BASE64:-}" ] && \
             ! printf '%s' "$IOS_DIST_CERT_P12_BASE64" | tr -d '\n' | base64 -d >/dev/null 2>&1; then
            echo "::error::IOS_DIST_CERT_P12_BASE64 is not valid base64. Re-copy the contents of ios-certs/p12-base64.txt."
            exit 1
          fi

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing GitHub Secrets: ${missing[*]}"
            echo "Add them in: GitHub → Settings → Secrets and variables → Actions → New repository secret"
            echo "Required secrets:"
            echo "  APPLE_TEAM_ID              Apple Developer Team ID"
            echo "  IOS_DIST_CERT_P12_BASE64   contents of ios-certs/p12-base64.txt"
            echo "  IOS_DIST_CERT_PASSWORD     password used when the .p12 was created"
            echo "  APPSTORE_ISSUER_ID         App Store Connect → Integrations → Keys"
            echo "  APPSTORE_KEY_ID            same page"
            echo "  APPSTORE_PRIVATE_KEY       contents of AuthKey_XXXX.p8"
            exit 1
          fi
          echo "All required Apple secrets are present."

      - uses: actions/checkout@v5

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      - name: Download provisioning profile
        uses: apple-actions/download-provisioning-profiles@v3
        with:
          bundle-id: app.lyve.ios
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Select Xcode with iOS SDK 26+
        run: |
          echo "Workflow revision: $WORKFLOW_REVISION"
          selected_developer_dir=""
          selected_sdk_key=0
          selected_sdk_version=""

          while IFS= read -r xcode_app; do
            developer_dir="$xcode_app/Contents/Developer"
            sdk_version=$(DEVELOPER_DIR="$developer_dir" xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || true)
            [ -n "$sdk_version" ] || continue
            sdk_major=${sdk_version%%.*}
            sdk_minor=${sdk_version#*.}
            sdk_minor=${sdk_minor%%.*}
            [[ "$sdk_major" =~ ^[0-9]+$ ]] || continue
            [[ "$sdk_minor" =~ ^[0-9]+$ ]] || sdk_minor=0
            sdk_key=$((sdk_major * 1000 + sdk_minor))

            echo "Found $(basename "$xcode_app") with iOS SDK $sdk_version"
            if [ "$sdk_major" -ge 26 ] && [ "$sdk_key" -gt "$selected_sdk_key" ]; then
              selected_developer_dir="$developer_dir"
              selected_sdk_key="$sdk_key"
              selected_sdk_version="$sdk_version"
            fi
          done < <(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort)

          if [ -z "$selected_developer_dir" ]; then
            echo "::error::This runner has no Xcode installation containing iOS SDK 26 or later."
            echo "Installed Xcode applications:"
            find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print
            exit 1
          fi

          sudo xcode-select -s "$selected_developer_dir"
          echo "DEVELOPER_DIR=$selected_developer_dir" >> "$GITHUB_ENV"
          echo "Selected $selected_developer_dir (iOS SDK $selected_sdk_version)"
          DEVELOPER_DIR="$selected_developer_dir" xcodebuild -version
          DEVELOPER_DIR="$selected_developer_dir" xcrun --sdk iphoneos --show-sdk-version


      - name: Runner toolchain diagnostics
        run: |
          log="$RUNNER_TEMP/toolchain-diagnostics.log"
          {
            echo "=== Runner image ==="
            sw_vers || true
            uname -a || true
            echo
            echo "=== Installed Xcode apps ==="
            for app in /Applications/Xcode*.app; do
              [ -d "$app" ] || continue
              ver=$(DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -version 2>/dev/null | tr '\n' ' ')
              sdk=$(DEVELOPER_DIR="$app/Contents/Developer" xcrun --sdk iphoneos --show-sdk-version 2>/dev/null)
              echo "$app | $ver | iOS SDK ${sdk:-unknown}"
            done
            echo
            echo "=== Active toolchain ==="
            xcode-select -p || true
            xcodebuild -version || true
            echo "Active iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version 2>/dev/null)"
            echo
            echo "=== Available SDKs ==="
            xcodebuild -showsdks || true
            echo
            echo "=== Signing identities (names only) ==="
            security find-identity -v -p codesigning | sed 's/[0-9A-F]\{40\}/<hash>/g' || true
          } 2>&1 | tee "$log"

          {
            echo "### iOS toolchain"
            echo '```'
            grep -E 'Xcode|iOS SDK|Active' "$log" | head -n 40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Build web assets
        run: bun run build

      - name: Sync Capacitor iOS project
        run: bunx cap sync ios

      - name: Verify Xcode and iOS SDK
        run: |
          xcodebuild -version
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          SDK_MAJOR=${SDK_VERSION%%.*}
          echo "Using iOS SDK $SDK_VERSION"
          if [ "$SDK_MAJOR" -lt 26 ]; then
            echo "::error::Xcode selection failed: App Store Connect requires iOS SDK 26 or later, but the active SDK is $SDK_VERSION."
            exit 1
          fi

      - name: Set build number
        run: |
          BUILD_NUMBER="${{ github.event.inputs.build_number }}"
          if [ -z "$BUILD_NUMBER" ]; then BUILD_NUMBER="${{ github.run_number }}"; fi
          cd ios/App
          xcrun agvtool new-version -all "$BUILD_NUMBER"

      - name: Resolve provisioning profile UUID
        id: profile
        run: |
          profile_path=$(find "$HOME/Library/MobileDevice/Provisioning Profiles" -name "*.mobileprovision" -print -quit)
          if [ -z "$profile_path" ]; then
            echo "::error::No provisioning profile found in ~/Library/MobileDevice/Provisioning Profiles"
            exit 1
          fi
          security cms -D -i "$profile_path" -o "$RUNNER_TEMP/profile.plist"
          uuid=$(plutil -extract UUID raw "$RUNNER_TEMP/profile.plist")
          name=$(plutil -extract Name raw "$RUNNER_TEMP/profile.plist")
          echo "Profile: $profile_path"
          echo "UUID: $uuid"
          echo "Name: $name"
          echo "uuid=$uuid" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"


      - name: Archive
        run: |
          set -o pipefail
          echo "::group::xcodebuild archive (full log)"
          xcodebuild -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/LYVE.xcarchive" \
            -showBuildTimingSummary \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE="${{ steps.profile.outputs.uuid }}" \
            archive 2>&1 | tee "$RUNNER_TEMP/xcodebuild-archive.log"
          status=$?
          echo "::endgroup::"
          bash .github/scripts/report-ios-log.sh "$RUNNER_TEMP/xcodebuild-archive.log" "Archive"
          exit $status



      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>app.lyve.ios</key><string>${{ steps.profile.outputs.name }}</string>
            </dict>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          echo "::group::xcodebuild -exportArchive (full log)"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LYVE.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" 2>&1 | tee "$RUNNER_TEMP/xcodebuild-export.log"
          status=$?
          echo "::endgroup::"
          bash .github/scripts/report-ios-log.sh "$RUNNER_TEMP/xcodebuild-export.log" "Export IPA"
          exit $status

      - name: Upload to TestFlight
        run: |
          set -o pipefail
          mkdir -p ~/private_keys
          echo "${{ secrets.APPSTORE_PRIVATE_KEY }}" > ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8
          echo "::group::altool upload (full log)"
          xcrun altool --upload-app -f "$RUNNER_TEMP/export/App.ipa" -t ios \
            --apiKey "${{ secrets.APPSTORE_KEY_ID }}" \
            --apiIssuer "${{ secrets.APPSTORE_ISSUER_ID }}" \
            --verbose 2>&1 | tee "$RUNNER_TEMP/altool-upload.log"
          status=$?
          echo "::endgroup::"
          bash .github/scripts/report-ios-log.sh "$RUNNER_TEMP/altool-upload.log" "TestFlight upload"
          exit $status

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lyve-ios-build-logs
          path: |
            ${{ runner.temp }}/toolchain-diagnostics.log
            ${{ runner.temp }}/xcodebuild-archive.log
            ${{ runner.temp }}/xcodebuild-export.log
            ${{ runner.temp }}/altool-upload.log
            ${{ runner.temp }}/ExportOptions.plist
            ios/App/build.log
          if-no-files-found: ignore


      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lyve-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore


  # Required status check that branch protection can gate on before merging.
  # It mirrors the build result so that the overall workflow outcome is visible
  # as a single, stable check name.
  ios-testflight-status:
    name: iOS TestFlight Build
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Report iOS TestFlight build status
        run: |
          BUILD_RESULT="${{ needs.build.result }}"
          echo "Build job result: $BUILD_RESULT"
          if [ "$BUILD_RESULT" == "success" ]; then
            echo "iOS TestFlight build passed."
            exit 0
          else
            echo "iOS TestFlight build did not pass (result: $BUILD_RESULT)."
            exit 1
          fi
