name: Android Play Build

# Builds the LYVE Android shell (Capacitor) and produces a signed AAB that can
# be uploaded to Google Play. Run it manually from the Actions tab; the AAB is
# attached as a workflow artifact.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name shown in Play (e.g. 1.0.1)"
        required: false
        default: "1.0.1"
      version_code:
        description: "Version code (leave empty to use the run number)"
        required: false
        default: ""
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/android-play.yml"
      - "android/**"
      - "capacitor.config.ts"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      APPLICATION_ID: app.lyve.android

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web assets
        run: bun run build

      - name: Sync Capacitor Android
        run: bunx cap sync android

      - name: Decode upload keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — building an unsigned AAB (cannot be uploaded to Play)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\n' | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build AAB
        env:
          ANDROID_VERSION_NAME: ${{ github.event.inputs.version_name || '1.0.1' }}
          ANDROID_VERSION_CODE: ${{ github.event.inputs.version_code || github.run_number }}
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/upload.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: lyve-android-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
