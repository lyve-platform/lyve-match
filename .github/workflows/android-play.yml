name: Android Play Build

# Builds the LYVE Android shell (Capacitor) and produces a signed AAB that can
# be uploaded to Google Play. Run it manually from the Actions tab; the AAB is
# attached as a workflow artifact.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name shown in Play (e.g. 1.0.1)"
        required: false
        default: "1.0.1"
      version_code:
        description: "Version code (leave empty to use the run number)"
        required: false
        default: ""
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/android-play.yml"
      - "android/**"
      - "capacitor.config.ts"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      APPLICATION_ID: app.lyve.android

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # AGP 8.13 needs SDK platform 36 + build-tools; install them explicitly so
      # the build never fails on a runner image that ships a different set.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      # Not --frozen-lockfile: the lockfile is regenerated by the platform, and a
      # harmless drift must not fail the release build (matches the iOS workflow).
      - name: Install dependencies
        run: bun install

      - name: Build web assets
        run: bun run build

      - name: Sync Capacitor Android
        run: |
          # Capacitor writes generated JSON files here. Git ignores those files,
          # so a fresh GitHub runner must recreate the directory before syncing.
          mkdir -p android/app/src/main/assets
          bunx cap sync android

      - name: Verify native Play Billing bridge is present
        run: |
          for source in LyveBilling.java MainActivity.java; do
            if [ ! -f "android/app/src/main/java/app/lyve/android/$source" ]; then
              echo "::error::$source is missing from the Android target."
              exit 1
            fi
          done
          grep -q "registerPlugin(LyveBilling.class)" android/app/src/main/java/app/lyve/android/MainActivity.java \
            || { echo "::error::LyveBilling is not registered in MainActivity."; exit 1; }

      - name: Decode upload keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — PR smoke build only (unsigned)."
              echo "signed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Play rejects unsigned bundles ('All uploaded bundles must be signed'). Add the base64 of upload.jks in GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi

          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD is missing. Add it in GitHub Actions secrets."
            exit 1
          fi
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > "$RUNNER_TEMP/upload.jks"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64. Replace it with the complete value."
            exit 1
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build AAB
        env:
          ANDROID_VERSION_NAME: ${{ github.event.inputs.version_name || '1.0.1' }}
          ANDROID_VERSION_CODE: ${{ github.event.inputs.version_code || github.run_number }}
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/upload.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'lyve-upload' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Verify the AAB is signed
        if: steps.keystore.outputs.signed == 'true'
        run: |
          aab=$(ls android/app/build/outputs/bundle/release/*.aab | head -1)
          if ! unzip -l "$aab" | grep -qi "META-INF/.*\.\(RSA\|EC\|DSA\)"; then
            echo "::error::The produced AAB is not signed. Check the keystore secrets."
            exit 1
          fi
          echo "Signed AAB: $aab"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: lyve-android-aab

          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
